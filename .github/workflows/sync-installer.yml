name: sync-installer

on:
  push:
    paths:
      - .github/workflows/sync-installer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published installer and verify its hash
        run: |
          curl -fsSL "https://onair.letsstreamit.com/install.sh?cb=${GITHUB_RUN_ID}" -o install.sh
          echo "4dcfb1e5fa4c5d6f43a8387a5b44616f789d5a331870645b650fb572059d3a35  install.sh" | sha256sum -c -
      - name: Commit when it differs
        run: |
          if git diff --quiet -- install.sh; then
            echo "install.sh already matches the published script"
            exit 0
          fi
          git config user.name "LetsStreamIt mirror"
          git config user.email "mirror@letsstreamit.com"
          git add install.sh
          git commit -m "Sync install.sh from onair.letsstreamit.com (1.1.4)"
          git push
