# One-shot: bring install.sh and README.md to 1.1.5 from a patch stored outside
# the repository, then delete this workflow. The patch and the resulting script
# are pinned by SHA-256, so the host can only serve that exact diff.
name: sync install.sh
on:
  push:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the 1.1.5 patch
        run: |
          set -eu
          ok=0
          for url in https://paste.rs/uyWCa https://d.uguu.se/PmCVWxSEolOA.patch; do
            if curl -fsSL --retry 2 -o /tmp/sync.patch "$url" \
              && echo "3afa1746dd13a70ba1a50598736790afa4e150bed58767f4002fe56ffeadb1d1  /tmp/sync.patch" | sha256sum -c -; then
              ok=1; break
            fi
          done
          test "$ok" = 1
          git apply --check /tmp/sync.patch
          git apply /tmp/sync.patch
          echo "d2906eda3dcd72173845e669329d858f84bb41f57a6b766f99911aafbacfc16f  install.sh" | sha256sum -c -
          git config user.name "letsstreamit-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q .github/workflows/sync-install.yml
          git add install.sh README.md
          git commit -q -m "install.sh: 1.1.5"
          git push
