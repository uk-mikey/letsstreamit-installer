name: mirror-installer

# One-shot refresh: fetches the published installer, checks it against the recorded
# SHA-256 and commits it, so the copy here never depends on retyped bytes.
# Triggers only on changes to this file, so the commit it makes cannot re-trigger it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-installer.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify installer
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o install.sh \
            https://onair.letsstreamit.com/install.sh
          echo "24afb82fd1843c03f89761b965e45600c3adf4f5e1eec98477f13e4ac07f0f5a  install.sh" | sha256sum -c -
          chmod +x install.sh
          sh -n install.sh

      - name: Commit installer
        run: |
          set -euo pipefail
          git config user.name 'installer-mirror'
          git config user.email 'installer-mirror@users.noreply.github.com'
          git add install.sh
          git commit -m 'Update installer mirror (sha256 24afb82f)'
          git push origin HEAD:main
